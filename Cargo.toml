[package]
name = "rust-template-generated-lib"
version = "0.2.5-alpha.0"
edition = "2024"
rust-version = "1.94.0"
description = "Example project generated by gifnksm/rust-tmeplate"
repository = "https://github.com/gifnksm/rust-template-generated-lib"
license = "MIT OR Apache-2.0"
keywords = []
categories = []

[package.metadata.cargo-sync-rdme.badge]
style = "flat-square"
badges = {
  maintenance = true,
  license = { link = "#license" },
  crates-io = true,
  docs-rs = true,
  rust-version = true,
  github-actions = { workflows = "ci.yml" },
  codecov = true,
}

[package.metadata.cargo-sync-rdme.rustdoc]
toolchain = "nightly"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[badges]
maintenance = { status = "passively-maintained" }

[profile.dev]
# for faster development iterations
debug = "line-tables-only"
